<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Article | hassanBake</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/article.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>

<body>
    <div class="page-wrapper">

        <!-- Header (دقیقاً همان قبلی) -->
        <header class="site-header">
        <div class="header-left">
            <a href="/">
            <img src="assets/images/logo-header.png"
                alt="hassanBake logo"
                class="header-logo" />
            </a>

            <!-- toggle زبان مقاله -->
            <button class="lang-switch hidden" id="articleLangToggle">
            فارسی
            </button>
        </div>

        <nav class="header-nav">
            <a href="#">Posts</a>
            <a href="#">About</a>
        </nav>
        </header>

        <!-- Main -->
        <main class="site-main article-page">
        <div class="article-container">

            <article class="article-content prose" id="articleContent">
            <!-- markdown injects here -->
            </article>

            <aside class="article-meta">
            <div class="author-card">
                <img src="assets/images/author.jpg" alt="Author" />
                <h3>Hassan</h3>
                <div class="author-role">Author</div>
                <time id="articleDate">2025</time>
            </div>
            </aside>

        </div>
        </main>

        <!-- Footer (همان قبلی) -->
        <footer class="site-footer">
        <p>© 2025 hassanBake. All rights reserved.</p>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="js/article.js"></script>
</body>
</html>
